services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: vasanthdockerx/amazon-clone-backend:latest
    networks:
      - amazon-clone-net
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: vasanthdockerx/amazon-clone-frontend:latest
    networks:
      - amazon-clone-net
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: vasanthdockerx/amazon-clone-nginx:latest
    ports:
      - "80:80"
    networks:
      - amazon-clone-net
    depends_on:
      - frontend
      - backend

networks:
  amazon-clone-net:
    driver: bridge
